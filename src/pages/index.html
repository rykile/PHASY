<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TROPAR - 日本語コミュニティ MVP">
  <title>TROPAR｜コミュニティ</title>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#17181b;--muted:#737781;--line:#e6e7eb;--accent:#6d45d8;--shadow:0 8px 30px rgba(20,20,40,.06)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .nav{max-width:1100px;margin:auto;height:62px;padding:0 18px;display:flex;align-items:center;gap:18px}.logo{font-weight:900;letter-spacing:.08em;font-size:20px}.logo span{color:var(--accent)}
    .navlinks{display:flex;gap:4px;margin-left:auto}.navlinks button,.ghost{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px}.navlinks button:hover,.ghost:hover{background:#f0edff;color:var(--accent)}
    .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 50px}.hero{background:linear-gradient(135deg,#29223e,#6d45d8);color:white;border-radius:22px;padding:28px;margin-bottom:22px;box-shadow:var(--shadow)}
    .hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:rgba(255,255,255,.82)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
    .side,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.side{padding:12px;height:max-content;position:sticky;top:82px}
    .side h3{font-size:12px;color:var(--muted);margin:8px 10px}.cat{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px}.cat.active,.cat:hover{background:#f0edff;color:var(--accent);font-weight:700}
    .toolbar{display:flex;gap:8px;padding:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}.search:focus{border-color:var(--accent)}
    .primary{border:0;background:var(--accent);color:white;border-radius:11px;padding:10px 14px;font-weight:700}.primary:hover{background:#5c35c7}
    .thread{padding:17px 18px;border-bottom:1px solid var(--line)}.thread:last-child{border-bottom:0}.thread h3{margin:5px 0 7px;font-size:16px}
    .meta{font-size:12px;color:var(--muted)}.body{color:#40434a;white-space:pre-wrap;word-break:break-word;line-height:1.55}.tag{display:inline-block;background:#f1f2f5;border-radius:999px;padding:3px 8px;font-size:11px;color:#656873;margin:6px 4px 0 0}
    .actions{display:flex;gap:7px;margin-top:10px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;color:var(--muted)}.actions button:hover{background:#f7f7f9}
    .empty{padding:50px 20px;text-align:center;color:var(--muted)}.count{margin-left:auto;color:var(--muted);font-size:12px}
    dialog{border:0;border-radius:18px;width:min(560px,calc(100% - 24px));padding:0;box-shadow:0 25px 80px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(10,10,20,.48)}
    .modal{padding:20px}.modal h2{margin:0 0 16px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
    .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.field textarea{min-height:130px;resize:vertical}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.secondary{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.side h3{display:none}.cat{white-space:nowrap;width:auto}.hero{padding:22px}.hero h1{font-size:23px}.wrap{padding:16px 12px 40px}}
    @media(max-width:460px){.nav{padding:0 12px}.thread{padding:15px}.toolbar{padding:10px}}
  </style>
</head>
<body>
<header class="top"><nav class="nav"><div class="logo">TRO<span>PAR</span></div><div class="navlinks"><button id="newBtn">＋ スレッド作成</button></div></nav></header>
<div class="wrap">
  <section class="hero"><h1>掲示板 × SNS × ニュース</h1><p>みんなで語り合える、日本語コミュニティ。</p></section>
  <div class="layout">
    <aside class="side"><h3>カテゴリー</h3>
      <button class="cat active" data-cat="">🌐 すべて</button><button class="cat" data-cat="雑談">💬 雑談</button>
      <button class="cat" data-cat="ゲーム">🎮 ゲーム</button><button class="cat" data-cat="音楽">🎧 音楽</button>
      <button class="cat" data-cat="勉強">📚 勉強</button><button class="cat" data-cat="PC・IT">💻 PC・IT</button>
      <button class="cat" data-cat="ニュース">📰 ニュース</button><button class="cat" data-cat="質問">❓ 質問</button>
    </aside>
    <main class="panel"><div class="toolbar">
      <input id="search" class="search" placeholder="スレッドを検索…"><button id="sortBtn" class="ghost">新着順 ↕</button>
      <button id="newBtn2" class="primary">＋ 投稿</button><span id="count" class="count"></span>
    </div><div id="threads"></div></main>
  </div>
</div>
<dialog id="dialog"><form id="threadForm" class="modal">
  <h2>新しいスレッド</h2>
  <div class="field"><label for="title">タイトル</label><input id="title" maxlength="100" required placeholder="スレッドのタイトル"></div>
  <div class="field"><label for="name">名前</label><input id="name" maxlength="30" required placeholder="表示名"></div>
  <div class="field"><label for="category">カテゴリー</label><select id="category" required><option value="">選択してください</option><option>雑談</option><option>ゲーム</option><option>音楽</option><option>勉強</option><option>PC・IT</option><option>ニュース</option><option>質問</option></select></div>
  <div class="field"><label for="body">本文</label><textarea id="body" maxlength="2000" required placeholder="本文を入力してください"></textarea></div>
  <div class="modal-actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button class="primary" type="submit">投稿する</button></div>
</form></dialog>
<script src="script_v2.js"></script>
</body>
</html>
